onboarding = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[ui]
show_agent_labels_on_pane_borders = true

status_indicators = "symbols"
[theme]
name = "tokyo-night"
auto_switch = false

[theme.custom]
surface_dim = "#565f89" # サイドバーとペインの境界線

[experimental]
# prefix の後は英数入力に切り替え、日本語 IME のままでもコマンドが効くようにする
switch_ascii_input_source_in_prefix = true

[keys]
detach = "prefix+d"
# WezTerm の Cmd+K から送られてくる
clear_pane = "prefix+ctrl+k"

# Option+j/k でペインを上下に、Option+Shift+j/k でワークスペースを移動する
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
next_workspace = "alt+shift+j"
previous_workspace = "alt+shift+k"

# Option+h/l でペインを左右に移動し、端を越えたらタブを切り替える
[[keys.command]]
key = "alt+h"
type = "shell"
command = "~/.config/herdr/scripts/move-focus.sh left"

[[keys.command]]
key = "alt+l"
type = "shell"
command = "~/.config/herdr/scripts/move-focus.sh right"
